<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ONELINEDIARY</title>
    
    
    <link href="./css/common.css" rel="stylesheet">
    <link href="./css/index.css" rel="stylesheet">

    
     <script src="./js/session.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/index.js"></script>
    <script src="./js/viewChange.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/util.js"></script>
     <script src="./js/menuChange.js"></script>




</head>
<body>
    
    <div id="wrap">

        <!-- 타이틀 -->
        <div class="title_wrap">
            Oneline Diary
        </div>

        <!-- 메뉴 -->
        <div class="menu_wrap">
            <a class="sign_up" href="#none">Sign-up</a>
            <a class="sign_in" href="#none">Sign-in</a>
            <a class="sign_out" href="#none">Sign-out</a>
            <a class="write" href="#none">Write</a>
            <a class="list" href="#none">List</a>
        </div>

        <!-- 회원가입 화면-->
        <div class="sign_up_wrap">
            <input type="text" name="u_id" placeholder="Input new user ID!">
            <br>
            <input type="password" name="u_pw" placeholder="Input new user PW!">
            <br>
            <input type="email" name="u_mail" placeholder="Input new user MAIL!">
            <br>
            <input type="button" value="SIGN UP">
        </div>

        <!-- 로그인 화면-->
        <div class="sign_in_wrap">
            <input type="text" name="u_id" placeholder="Input user ID!">
            <br>
            <input type="password" name="u_pw" placeholder="Input user PW!">
            <br>
            <input type="button" value="SIGN IN">
        </div>

        <!-- 일기 쓰기 화면-->
        <div class="write_wrap">
            <input type="text" placeholder="Input new diary"><button>Write</button>
        </div>

        <!-- 일기 리스트 화면-->
        <div class="list_wrap">

        </div>

    </div>

</body>
</html>
