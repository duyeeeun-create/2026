<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>

    <script>
        // 컨테이너(container)자료형: 여러가지의 데이터를 하나로 묶어 관리한다
        // 파이썬 ex. list,tuple,dictionary
        // 자바스크립트 Array(배열), Map(맵)


        //배열
        //선언방법
        var nums = [1,2,3,4,5,6]; //nums는 레퍼런스 타입
        // 조회 방법 - 인덱스라는 번호를 통해
        console.log(nums[3]);//4
        // 배열 nums에 마지막 인덱스에 해당하는 데이터 조회
        // console.log(nums[4]);//5
        console.log(nums[nums.length -1]); //6
        console.log(nums[0]);//1


        //배열의 크기 (길이, lenght) 조회
        console.log(`nums.length: ${nums.length}`); //nums.length: 6

        // 배열의 전체 데이터 조회
        for(var i = 0; i < nums.length; i++){
            console.log(nums[i]);

        }
        //forEach
        nums.forEach((num) => {
             console.log(num);

        });

        nums.forEach((num, idx) => {
            console.log(num);
            console.log(idx);


        });// 인덱스 값

        var users = [
            {name: '길동', age : 20},
            {name: '예은', age : 30},
            {name: '세리', age : 40},


        ]
////////////////////////////////////////////////////////
    //answer 1
    for(var i = 0; i < users.length; i++){
        var user = users[i];
        console.log(`name: ${user.name}, age: ${user.age}`);
    } 

    //answer 2
    users.forEach((user) => {
       console.log(`name: ${user.name}, age: ${user.age}`);

    })// 데이터 하나있으면 .forEach(user => { 소괄호 빼자

    //맵 (Map) 은 object 랑 거의 비슷하다
    //선언방법
   var myInfo = new Map(); // key : value
//    myInfo.set(key, value);
   myInfo.set('name', '홍길동');
   myInfo.set('age', 20);

   //데이터 조회
    console.log(myInfo.get('name')); //홍길동
    console.log(myInfo.get('age'));  // 20
    console.log(myInfo.get('abc'));  // undefined(정의 되지 않음)

    // 데이터 삭제
    myInfo.delete('age');
    console.log(myInfo.get('age'));  // undefined

    //데이터 수정
    myInfo.set('name','홍길자');
    console.log(myInfo.get('name')); //홍길자



   


   

    </script>
</head>

</body>
</html>
